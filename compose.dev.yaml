# The dev instance (DEC-040, DEC-050): the development folder ~/bin-there on ubuntubot, on
# whatever branch is being worked on (usually `dev`), on port 3001, against a throwaway copy
# of the live data (scripts/dev-data-refresh.sh). No backups: nothing here is worth keeping.
# The AI data fill (DEC-048, DEC-049) runs here too: its own Ollama container on the GPU with
# the models in a named volume, the web search going to the SearXNG already on the host, and
# the shop API keys read from a `.env` beside this file (compose reads it by itself):
#   MOUSER_API_KEY=…            from mouser.com/api-hub (Search API)
#   DIGIKEY_CLIENT_ID=…         from developer.digikey.com (an app with Product Information V4)
#   DIGIKEY_CLIENT_SECRET=…
#   docker compose -f compose.dev.yaml up -d --build
#   docker exec bin-there-ollama ollama pull gemma3:4b      # once, or whatever AI_MODEL is
# The live app is ~/bin-there-prod (compose.yaml), which never runs the AI until it ships.
name: bin-there-dev
services:
  bin-there-dev:
    build: .
    container_name: bin-there-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: ${TZ:-UTC}
      AI_URL: http://ollama:11434
      # gemma3:4b: it reads printed part numbers as well as the 12b does, and the shops supply the
      # details; the 12b (pulled, 8 GB of the card) is a judgement-call improvement that would mean
      # the card to itself (DEC-053). AI_MODEL=gemma3:12b in .env switches.
      AI_MODEL: ${AI_MODEL:-gemma3:4b}
      SEARCH_URL: ${SEARCH_URL:-http://host.docker.internal:8989}
      MOUSER_API_KEY: ${MOUSER_API_KEY:-}
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID:-}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    container_name: bin-there-ollama
    restart: unless-stopped
    # At boot Docker starts this before the card's driver is up, and Ollama then runs on the CPU
    # all day (ten times slower; `ollama ps` says "100% CPU"). So: wait for the card, up to two
    # minutes, before serving (DEC-049 found the first case, DEC-053 the boot one).
    entrypoint: ["sh", "-c", "n=0; until nvidia-smi >/dev/null 2>&1 || [ $$n -ge 60 ]; do n=$$((n+1)); sleep 2; done; exec ollama serve"]
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    # The card's device files, named as well as reserved below. Without them the container loses
    # the card whenever systemd reloads (package updates do it) and Ollama quietly drops to the
    # CPU, ten times slower: "Failed to initialize NVML" from nvidia-smi inside it (DEC-049).
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  ollama-models:
    # The volume the ai instance pulled gemma3:4b into (DEC-048); kept so nothing downloads again.
    name: bin-there-ai_ollama-models
    external: true
